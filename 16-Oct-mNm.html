<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>حدث في مثل هذا اليوم | الأرشيف التاريخي</title>

    <!-- Google Fonts: Aref Ruqaa Ink, Alexandria, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Aref+Ruqaa+Ink:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Libraries: html2canvas (Export) & canvas-confetti (Celebration) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* ==========================================================================
           1. المتغيرات والهوية البصرية الأساسية (Base Editorial Palette)
           ========================================================================== */
        :root {
            --bg-primary: #FAF7F2;
            --bg-secondary: #F3EFE6;
            --bg-card: #FFFFFF;
            --bg-accent-subtle: #EAE3D2;

            --text-primary: #1E293B;
            --text-secondary: #475569;
            --text-muted: #64748B;

            --accent-green: #1B5E3A;
            --accent-green-light: #E8F3EE;
            --accent-gold: #9A6B16;
            --accent-gold-light: #F9F3E3;

            --border-color: #E4DEC9;
            --border-strong: #D1C7AE;

            --shadow-sm: 0 2px 6px rgba(30, 41, 59, 0.04);
            --shadow-md: 0 8px 24px rgba(30, 41, 59, 0.06);

            /* تم تطبيق خطوط الإسكندرية (Alexandria) وعارف رقعة (Aref Ruqaa) هنا */
            --font-serif: 'Aref Ruqaa Ink', serif;
            --font-sans: 'Alexandria', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --container-width: 1080px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-card: #1E293B;
            --bg-accent-subtle: #334155;

            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;

            --accent-green: #34D399;
            --accent-green-light: rgba(52, 211, 153, 0.12);
            --accent-gold: #FBBF24;
            --accent-gold-light: rgba(251, 191, 36, 0.12);

            --border-color: #334155;
            --border-strong: #475569;
        }

        /* ==========================================================================
           الألوان الخاصة بتاريخ 16 أكتوبر (Brazil Palette Theme)
           ========================================================================== */
        body[data-special-theme="oct16"] {
            --accent-green: #009739;
            --accent-green-light: rgba(0, 151, 57, 0.12);
            --accent-gold: #012169;
            --accent-gold-light: rgba(254, 221, 0, 0.25);
            --special-yellow: #FEDD00;
            --special-blue: #012169;
        }

        body[data-special-theme="oct16"] .timeline::before {
            background: linear-gradient(180deg, var(--accent-green), var(--special-yellow), var(--special-blue));
        }

        body[data-special-theme="oct16"] .year-pill {
            color: var(--special-blue);
            background-color: var(--accent-gold-light);
            border-color: var(--special-yellow);
        }

        body[data-special-theme="oct16"] .date-badge-mini {
            border-color: rgba(0, 151, 57, 0.3);
            background-color: var(--accent-green-light);
            color: var(--accent-green);
        }

        body[data-special-theme="oct16"] .timeline-dot {
            border-color: var(--special-yellow);
        }

        body[data-special-theme="oct16"] .timeline-item:hover .timeline-dot {
            background-color: var(--special-blue);
            border-color: var(--special-blue);
        }

        body[data-special-theme="oct16"] .special-hero-image {
            background: linear-gradient(135deg, var(--accent-green), var(--special-yellow), var(--special-blue));
        }

        body[data-special-theme="oct16"] .share-btn {
            color: var(--special-blue);
            border-color: var(--special-blue);
        }

        body[data-special-theme="oct16"] .share-btn:hover {
            background-color: var(--accent-gold-light);
        }

        body[data-special-theme="oct16"] .tab-btn.active {
            background-color: var(--accent-green);
            color: #FFFFFF;
            border-color: var(--accent-green);
        }

        body[data-special-theme="oct16"] .tab-btn.active .tab-count {
            background-color: var(--special-yellow);
            color: var(--special-blue);
        }

        body[data-special-theme="oct16"] #pageMainTitle {
            color: var(--accent-green);
        }

        body[data-special-theme="oct16"] #pageMainTitle .date-highlight {
            color: #FEDD00;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        body[data-special-theme="oct16"] #pageMainTitle .day-badge-16 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #012169 0%, #0a3594 100%);
            color: #FEDD00 !important;
            padding: 0.08em 0.35em;
            margin: 0 0.15em;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(1, 33, 105, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1.5px solid rgba(254, 221, 0, 0.45);
            font-family: var(--font-mono), var(--font-serif);
            vertical-align: middle;
            line-height: 1.1;
        }

        body[data-special-theme="oct16"] .image-lightbox-caption,
        body[data-special-theme="oct16"] .image-lightbox-caption strong,
        body[data-special-theme="oct16"] .image-lightbox-caption span {
            color: var(--special-yellow);
        }

        /* ==========================================================================
           2. الإعدادات الأساسية (Reset & Base)
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.7;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 clamp(1rem, 4vw, 2rem);
        }

        /* ==========================================================================
           3. الشريط العلوي والترويسة (Top Bar & Hero)
           ========================================================================== */
        .top-bar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0.65rem 0;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .top-bar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .credit-inline {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .credit-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            transition: var(--transition);
        }

        .credit-inline .dev-name {
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
        }

        .credit-inline .year-badge {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            background-color: var(--accent-gold-light);
            color: var(--accent-gold);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-weight: 600;
            transition: var(--transition);
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            border-color: var(--accent-gold);
            background-color: var(--bg-accent-subtle);
        }

        .hero {
            padding: clamp(2rem, 5vw, 3.5rem) 0 clamp(1.5rem, 4vw, 2.5rem);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            transition: var(--transition);
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
            margin-bottom: 0.75rem;
        }

        .hero h1 span {
            color: var(--accent-gold);
            transition: var(--transition);
        }

        .hero p {
            color: var(--text-secondary);
            font-size: clamp(0.95rem, 2.2vw, 1.15rem);
            max-width: 680px;
            margin: 0 auto;
        }

        .editorial-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--accent-green-light);
            color: var(--accent-green);
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid rgba(27, 94, 58, 0.15);
            transition: var(--transition);
        }

        /* تنسيق الصورة الخاصة بـ 16 أكتوبر وزر الصعود للأعلى لباقي التواريخ */
        .special-hero-image {
            margin: 0 auto 1.5rem auto;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-gold));
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: none;
            animation: scaleIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, floatGently 3s ease-in-out infinite 0.8s;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .special-hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            border-radius: 50%;
            border: 3px solid var(--bg-primary);
            transition: all 0.4s ease;
        }

        .special-hero-image.is-sticky {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 90px;
            height: 90px;
            margin: 0;
            animation: none;
            box-shadow: var(--shadow-md);
            cursor: pointer;
        }

        /* زر الصعود للأعلى (السهم) لباقي التواريخ */
        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-gold));
            color: #FFFFFF;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 99;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
        }

        .scroll-top-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .scroll-top-btn:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
        }

        .scroll-top-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes floatGently {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ==========================================================================
           4. لوحة التحكم والبحث (Controls & Filters)
           ========================================================================== */
        .controls-section {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.85rem;
            align-items: center;
        }

        .date-And-search {
            display: flex;
            gap: 0.65rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .select-group {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }

        select,
        .search-input {
            height: 42px;
            padding: 0 0.85rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .btn {
            min-height: 42px;
            height: auto;
            padding: 0.5rem 0.85rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            line-height: 1.35;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .search-wrapper {
            flex: 1;
            min-width: 200px;
        }

        .search-input {
            width: 100%;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #FFFFFF;
            border-color: var(--accent-green);
        }

        .btn-secondary:hover {
            background-color: var(--bg-secondary);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* التبويبات مع تطبيق خط Alexandria */
        .tabs-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.85rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
        }

        .tabs-bar::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            scroll-snap-align: start;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1.25rem;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            transition: var(--transition);
            flex-shrink: 0;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .tab-btn.active {
            background-color: var(--text-primary);
            color: var(--bg-primary);
            font-weight: 600;
            border-color: var(--text-primary);
        }

        .tab-count {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.05rem 0.45rem;
            border-radius: 12px;
            background-color: rgba(128, 128, 128, 0.15);
            transition: var(--transition);
            margin-right: 4px;
        }

        .tab-btn.active .tab-count {
            background-color: var(--accent-gold);
            color: #FFFFFF;
        }

        /* ==========================================================================
           5. الجدول الزمني والبطاقات (Timeline & Cards)
           ========================================================================== */
        main {
            flex: 1;
            padding: clamp(1.5rem, 4vw, 3rem) 0;
        }

        .timeline {
            position: relative;
            padding-right: 2.25rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            right: 0.65rem;
            top: 0.5rem;
            bottom: 0.5rem;
            width: 2px;
            background: linear-gradient(180deg, var(--accent-green), var(--accent-gold), var(--border-strong));
            transition: var(--transition);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.35s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timeline-dot {
            position: absolute;
            right: -2.05rem;
            top: 1.35rem;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--bg-primary);
            border: 3px solid var(--accent-green);
            box-shadow: 0 0 0 4px var(--bg-primary);
            transition: var(--transition);
            z-index: 2;
        }

        .timeline-item:hover .timeline-dot {
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            transform: scale(1.15);
        }

        .timeline-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: clamp(1.1rem, 3vw, 1.5rem);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.25rem;
            align-items: start;
            position: relative;
            overflow: hidden;
        }

        .timeline-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 0.65rem;
            flex-wrap: wrap;
        }

        .year-pill {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.92rem;
            background-color: var(--accent-gold-light);
            color: var(--accent-gold);
            padding: 0.18rem 0.65rem;
            border-radius: 6px;
            border: 1px solid rgba(154, 107, 22, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            transition: var(--transition);
        }

        .year-pill .era-m {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .date-badge-mini {
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 0.18rem 0.6rem;
            border-radius: 20px;
            transition: var(--transition);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .date-badge-mini .mini-icon {
            font-size: 0.82rem;
            opacity: 0.85;
        }

        .category-tag {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--accent-green);
            background-color: var(--accent-green-light);
            padding: 0.2rem 0.65rem;
            border-radius: 6px;
            font-weight: 600;
            transition: var(--transition);
        }

        .card-text {
            font-family: var(--font-sans);
            font-size: clamp(0.95rem, 2vw, 1.08rem);
            color: var(--text-primary);
            line-height: 1.75;
            margin-bottom: 0.85rem;
            transition: var(--transition);
        }

        .card-thumb {
            width: 110px;
            height: 110px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            cursor: zoom-in;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card-thumb:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        .card-thumb-placeholder {
            width: 110px;
            height: 110px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-accent-subtle));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
            padding: 0.5rem;
            transition: var(--transition);
            user-select: none;
        }

        .card-thumb-placeholder .placeholder-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .card-thumb-placeholder .placeholder-label {
            font-family: var(--font-sans);
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .timeline-card.exporting .card-thumb-placeholder {
            width: 160px !important;
            height: 160px !important;
        }

        /* نافذة تكبير الصورة (Image Lightbox Modal) */
        .image-lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            animation: fadeIn 0.25s ease forwards;
            cursor: zoom-out;
        }

        .image-lightbox.active {
            display: flex;
        }

        .image-lightbox-wrapper {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: default;
        }

        .image-lightbox-img {
            max-width: 85vw;
            max-height: 75vh;

        .drawer-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 20px; border-bottom: 1px solid var(--border-color); }
        .drawer-header h2 { font-size: 1.1rem; margin: 0 0 8px; }
        .drawer-header p { font-size: .75rem; color: var(--text-secondary); margin: 0; line-height: 1.8; }
        .drawer-close { min-width: 44px; min-height: 44px; font-size: 1.2rem; }
        .archive-drawer .controls-section { position: static; padding: 22px 0 max(24px, env(safe-area-inset-bottom)); border: 0; box-shadow: none; }
        .archive-drawer .container { width: 100%; padding: 0 20px; }
        .archive-drawer .controls-grid, .archive-drawer .date-And-search { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
        .archive-drawer .select-group { display: flex; width: 100%; gap: 8px; flex-wrap: wrap; }
        .archive-drawer select { min-width: 0; flex: 1; height: 48px; }
        .archive-drawer #fetchDateBtn { width: 100%; }
        .archive-drawer .search-wrapper { min-width: 0; width: 100%; }
        .archive-drawer .search-input { height: 48px; }
        .archive-drawer .action-buttons, .archive-drawer .action-buttons .btn { width: 100%; }
        .archive-drawer .tabs-bar { display: flex; flex-direction: column; gap: 10px; overflow: visible; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-color); }
        .archive-drawer .tab-btn { width: 100%; justify-content: space-between; min-height: 48px; border-radius: 12px; white-space: normal; text-align: right; }
        .archive-drawer :focus-visible, .drawer-toggle:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: 3px; }
        @keyframes drawer-enter { from { transform: translateX(100%); opacity: .4; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 480px) { .drawer-toggle { top: 12px; right: 12px; } .drawer-toggle .drawer-toggle-text { display: none; } }
        @media (prefers-reduced-motion: reduce) { .archive-drawer[open] { animation: none; } }
    </style>
</head>

    <script>

        const archiveDrawer = document.getElementById('archiveDrawer');
        const drawerToggle = document.getElementById('drawerToggle');
        let drawerScrollY = 0;
        let drawerBodyStyle = '';
        function openArchiveDrawer() {
            drawerScrollY = window.scrollY;
            drawerBodyStyle = document.body.style.cssText;
            archiveDrawer.showModal();
            document.body.style.position = 'fixed';
            document.body.style.top = `-${drawerScrollY}px`;
            document.body.style.width = '100%';
            document.body.style.overflow = 'hidden';
            drawerToggle.setAttribute('aria-expanded', 'true');
        }
        function closeArchiveDrawer() {
            if (!archiveDrawer.open) return;
            archiveDrawer.close();
            document.body.style.cssText = drawerBodyStyle;
            window.scrollTo({ top: drawerScrollY, behavior: 'instant' });
            drawerToggle.setAttribute('aria-expanded', 'false');
            drawerToggle.focus({ preventScroll: true });
        }
        drawerToggle.addEventListener('click', () => archiveDrawer.open ? closeArchiveDrawer() : openArchiveDrawer());
        document.getElementById('drawerClose').addEventListener('click', closeArchiveDrawer);
        archiveDrawer.addEventListener('click', (event) => {
            const bounds = archiveDrawer.getBoundingClientRect();
            if (event.target === archiveDrawer && (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom)) closeArchiveDrawer();
        });
        archiveDrawer.addEventListener('cancel', (event) => { event.preventDefault(); closeArchiveDrawer(); });
        document.getElementById('fetchDateBtn').addEventListener('click', closeArchiveDrawer);
        document.getElementById('tabsBar').addEventListener('click', (event) => {
            if (event.target.closest('.tab-btn')) closeArchiveDrawer();
        });
        document.getElementById('openQuizBtn').addEventListener('click', closeArchiveDrawer);
        archiveDrawer.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') event.stopPropagation();
        });

        // --- 1. تأثير الاحتفال (Confetti Animation) الخاص بـ 16 أكتوبر ---
        function triggerBirthdayCelebration() {
            const duration = 5000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

            const brazilColors = ['#009739', '#FEDD00', '#012169'];

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function () {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);

                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: brazilColors
                }));
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: brazilColors
                }));
            }, 250);
        }

        // --- 2. التحكم في زر الصعود للأعلى وتأثير Sticky للصورة عند السكرول ---
        window.addEventListener('scroll', () => {
            const isOct16 = (state.month === 10 && state.day === 16);
            const imgElement = document.getElementById('oct16Image');
            const scrollBtn = document.getElementById('scrollTopBtn');
            const scrolled = window.scrollY > 200;

            if (isOct16) {
                if (scrollBtn) scrollBtn.classList.remove('visible');
                if (imgElement && imgElement.style.display !== 'none') {
                    if (scrolled) {
                        imgElement.classList.add('is-sticky');
                    } else {
                        imgElement.classList.remove('is-sticky');
                    }
                }
            } else {
                if (imgElement) imgElement.classList.remove('is-sticky');
                if (scrollBtn) {
                    if (scrolled) {
                        scrollBtn.classList.add('visible');
                    } else {
                        scrollBtn.classList.remove('visible');
                    }
                }
            }
        });

        // --- 3. تصدير البطاقة كصورة ---
        async function exportCard(buttonElement, year, category) {
            const card = buttonElement.closest('.timeline-card');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

            const actionsArea = card.querySelector('.card-actions');
            actionsArea.style.display = 'none';

            const dateText = document.getElementById('pageMainTitle').innerText.replace('حدث في مثل هذا اليوم — ', '');
            const watermark = document.createElement('div');
            watermark.className = 'export-watermark';
            watermark.innerHTML = `
                <div class="ew-title">حدث في مثل هذا اليوم — <span>${dateText}</span></div>
                <div class="ew-copy">برمجة وتصميم <span>المهندس : مصطفى نعمان مراد</span> © 2026</div>
            `;
            card.appendChild(watermark);

            card.classList.add('exporting');

            const originalBtnText = buttonElement.innerHTML;
            buttonElement.innerHTML = '⏳ جاري الحفظ...';

            try {
                const canvas = await html2canvas(card, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: isDark ? '#1E293B' : '#FFFFFF',
                    logging: false
                });

                const link = document.createElement('a');
                link.download = `Event_${dateText.replace(' ', '_')}_${year}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                console.error("حدث خطأ أثناء تصدير الصورة:", error);
                alert("عذراً، حدث خطأ أثناء تجهيز الصورة.");
            } finally {
                card.classList.remove('exporting');
                card.removeChild(watermark);
                actionsArea.style.display = 'flex';
                buttonElement.innerHTML = originalBtnText;
            }
        }

        // --- 4. جلب البيانات والأرشيف ---
        const FALLBACK_OCT_16 = {
            events: [
                { year: 1793, text: "إعدام ملكة فرنسا ماري أنطوانيت زوجة الملك لويس السادس عشر بالمقصلة في باريس بتهمة الخيانة العظمى إبان الثورة الفرنسية.", pages: [{ title: "ماري أنطوانيت", content_urls: { desktop: { page: "https://ar.wikipedia.org/wiki/ماري_أنطوانيت" } } }] },
                { year: 1973, text: "الرئيس المصري محمد أنور السادات يلقي خطابه التاريخي أمام مجلس الشعب في ذروة حرب أكتوبر المجيدة عارضاً شروط السلام وفتح قناة السويس.", pages: [{ title: "حرب أكتوبر", content_urls: { desktop: { page: "https://ar.wikipedia.org/wiki/حرب_أكتوبر" } } }] },
                { year: 2002, text: "الافتتاح الرسمي العالمي لمكتبة الإسكندرية الجديدة في مصر بحضور قادة وملوك العالم إحياءً للمكتبة التاريخية القديمة.", pages: [{ title: "مكتبة الإسكندرية الجديدة", content_urls: { desktop: { page: "https://ar.wikipedia.org/wiki/مكتبة_الإسكندرية_الجديدة" } } }] }
            ],
            births: [
                { year: 1868, text: "أحمد شوقي، أمير الشعراء وأحد أعظم شعراء العربية في العصر الحديث.", pages: [{ title: "أحمد شوقي", content_urls: { desktop: { page: "https://ar.wikipedia.org/wiki/أحمد_شوقي" } } }] }
            ],
            deaths: [
                { year: 2011, text: "عمر الحريري، ممثل مصري قدير قدم عشرات الأعمال المسرحية والسينمائية الخالدة.", pages: [{ title: "عمر الحريري", content_urls: { desktop: { page: "https://ar.wikipedia.org/wiki/عمر_الحريري" } } }] }
            ],
            holidays: []
        };

        const MONTHS_AR = ["", "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const CAT_LABELS = { events: "حدث تاريخي", births: "مواليد", deaths: "وفيات", holidays: "مناسبة عالمية" };

        let state = { month: 10, day: 16, category: 'all', searchQuery: '', sortAsc: true, rawData: { events: [], births: [], deaths: [], holidays: [] } };

        const daySelect = document.getElementById('daySelect');
        for (let d = 1; d <= 31; d++) {
            const opt = document.createElement('option'); opt.value = d; opt.textContent = d;
            if (d === 16) opt.selected = true; daySelect.appendChild(opt);
        }

        async function loadOnThisDay(month, day) {
            const dateContent = (month === 10 && day === 16)
                ? `<span class="date-highlight"><span class="day-badge-16">16</span> أكتوبر</span>`
                : `<span>${day} ${MONTHS_AR[month]}</span>`;
            document.getElementById('pageMainTitle').innerHTML = `حدث في مثل هذا اليوم — ${dateContent}`;

            const specialImg = document.getElementById('oct16Image');
            const scrollBtn = document.getElementById('scrollTopBtn');

            // إضافة السمة الخاصة والصورة وتأثير الاحتفال فقط في 16 أكتوبر، وسهم الصعود للأعلى لباقي التواريخ
            if (month === 10 && day === 16) {
                if (specialImg) specialImg.style.display = 'block';
                if (scrollBtn) {
                    scrollBtn.style.display = 'none';
                    scrollBtn.classList.remove('visible');
                }
                document.body.setAttribute('data-special-theme', 'oct16');

                if (state.category === 'all' && state.searchQuery === '') {
                    triggerBirthdayCelebration();
                }
            } else {
                if (specialImg) {
                    specialImg.style.display = 'none';
                    specialImg.classList.remove('is-sticky');
                }
                if (scrollBtn) {
                    scrollBtn.style.display = 'flex';
                    if (window.scrollY > 200) scrollBtn.classList.add('visible');
                    else scrollBtn.classList.remove('visible');
                }
                document.body.removeAttribute('data-special-theme');
            }

            const mm = String(month).padStart(2, '0'); const dd = String(day).padStart(2, '0');
            const url = `https://api.wikimedia.org/feed/v1/wikipedia/ar/onthisday/all/${mm}/${dd}`;

            try {
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                state.rawData = { events: data.events || [], births: data.births || [], deaths: data.deaths || [], holidays: (data.holidays || []).map(h => ({ ...h, year: 'سنوياً' })) };
            } catch (err) {
                if (month === 10 && day === 16) {
                    state.rawData = FALLBACK_OCT_16;
                } else {
                    state.rawData = { events: [], births: [], deaths: [], holidays: [] };
                }
            }
            quizState.questions = [];
            quizState.currentIndex = 0;
            quizState.score = 0;
            updateCounters(); renderTimeline();
        }

        function updateCounters() {
            document.getElementById('count-events').textContent = state.rawData.events.length;
            document.getElementById('count-births').textContent = state.rawData.births.length;
            document.getElementById('count-deaths').textContent = state.rawData.deaths.length;
            document.getElementById('count-holidays').textContent = state.rawData.holidays.length;
            document.getElementById('count-all').textContent = state.rawData.events.length + state.rawData.births.length + state.rawData.deaths.length + state.rawData.holidays.length;
        }

        // --- 5. نظام مسابقة "أختبر معلوماتك لهذا اليوم" (10 أسئلة و 4 إجابات) ---
        let quizState = {
            questions: [],
            currentIndex: 0,
            score: 0,
            userAnswers: []
        };

        function generateQuizQuestions() {
            // تجميع كافة العناصر الصالحة للأسئلة
            const pool = [];
            ['events', 'births', 'deaths', 'holidays'].forEach(cat => {
                (state.rawData[cat] || []).forEach(it => {
                    if (it.text && it.text.trim().length > 15) {
                        pool.push({ ...it, _cat: cat });
                    }
                });
            });

            if (pool.length === 0) return [];

            // خلط عشوائي للعناصر لاختيار 10 أحداث مميزة
            const shuffledPool = [...pool].sort(() => 0.5 - Math.random());
            const selectedItems = shuffledPool.slice(0, 10);

            // استخراج مجموعة سنوات موثوقة لتوليد الخيارات الخاطئة
            const allYears = Array.from(new Set(
                pool.map(i => i.year).filter(y => typeof y === 'number' && !isNaN(y))
            ));

            return selectedItems.map((item, qIdx) => {
                const isYearQuestion = typeof item.year === 'number' && !isNaN(item.year) && (qIdx % 2 === 0 || allYears.length >= 4);

                let questionText = '';
                let correctAnswer = '';
                let distractors = [];
                let explanation = '';

                if (isYearQuestion) {
                    correctAnswer = String(item.year) + ' م';
                    explanation = `الحدث: ${item.text}`;

                    const catTitle = CAT_LABELS[item._cat] || 'الحدث';
                    // صياغة سؤال شيق ومحكم
                    const briefText = item.text.length > 120 ? item.text.substring(0, 115) + '...' : item.text;
                    questionText = `في أي عام حدث هذا الأمر (${catTitle}): "${briefText}"؟`;

                    // إنشاء 3 سنوات خاطئة قريبة ومقنعة
                    const fakeYears = new Set();
                    const offsets = [-1, 1, -2, 2, -5, 5, -10, 10, -3, 3, 7, -7];
                    for (let off of offsets.sort(() => 0.5 - Math.random())) {
                        const candidate = item.year + off;
                        if (candidate > 0 && candidate !== item.year) {
                            fakeYears.add(candidate + ' م');
                            if (fakeYears.size === 3) break;
                        }
                    }
                    // إذا لم نصل إلى 3 خيارات
                    while (fakeYears.size < 3) {
                        const randomYear = allYears[Math.floor(Math.random() * allYears.length)] || (item.year + fakeYears.size + 1);
                        if (randomYear !== item.year) fakeYears.add(randomYear + ' م');
                    }
                    distractors = Array.from(fakeYears).slice(0, 3);
                } else {
                    // سؤال عن الحدث أو الشخصية
                    const primaryPage = (item.pages && item.pages[0] && (item.pages[0].titles?.normalized || item.pages[0].title)) || '';
                    if (primaryPage && item.text.includes(primaryPage)) {
                        correctAnswer = primaryPage;
                        explanation = item.text;
                        const maskedText = item.text.replace(new RegExp(primaryPage, 'g'), '.............');
                        const briefText = maskedText.length > 130 ? maskedText.substring(0, 125) + '...' : maskedText;
                        questionText = `أكمل الفراغ بالاسم أو الحدث المناسب (${item.year ? item.year + ' م' : 'سنوياً'}): "${briefText}"؟`;

                        // خيارات بديلة من أسماء الصفحات الأخرى في الأحداث
                        const otherTitles = Array.from(new Set(
                            pool.flatMap(i => (i.pages || []).map(p => p.titles?.normalized || p.title))
                                .filter(t => t && t !== primaryPage && t.length > 2 && t.length < 35)
                        )).sort(() => 0.5 - Math.random());

                        distractors = otherTitles.slice(0, 3);
                        while (distractors.length < 3) {
                            distractors.push(['صلاح الدين الأيوبي', 'أحمد شوقي', 'جمال عبد الناصر', 'نجيب محفوظ', 'ابن سينا'][distractors.length]);
                        }
                    } else {
                        // بديل سنة موثوق في حال تعذر إخفاء الاسم
                        correctAnswer = (item.year ? item.year + ' م' : 'سنوياً');
                        explanation = item.text;
                        const briefText = item.text.length > 120 ? item.text.substring(0, 115) + '...' : item.text;
                        questionText = `في أي تاريخ أو سنة يرتبط الحدث التالي: "${briefText}"؟`;
                        distractors = [(item.year ? (item.year + 4) + ' م' : 'شهرياً'), (item.year ? (item.year - 6) + ' م' : 'كل عقد'), (item.year ? (item.year + 11) + ' م' : 'كل عامين')];
                    }
                }

                // دمج الخيارات وتشتيتها عشوائياً
                const allOptions = [correctAnswer, ...distractors].sort(() => 0.5 - Math.random());

                return {
                    id: qIdx + 1,
                    question: questionText,
                    options: allOptions,
                    correctAnswer: correctAnswer,
                    explanation: explanation,
                    category: CAT_LABELS[item._cat] || 'معلومات تاريخية',
                    year: item.year
                };
            });
        }

        let quizReturnFocus = null;

        function openQuizModal() {
            quizReturnFocus = document.activeElement;
            const modal = document.getElementById('quizModalBackdrop');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            renderQuiz();
            modal.querySelector('.quiz-close-btn').focus({ preventScroll: true });
        }

        function closeQuizModal() {
            const modal = document.getElementById('quizModalBackdrop');
            if (!modal.classList.contains('active')) return;
            modal.classList.remove('active');
            document.body.style.overflow = '';
            quizReturnFocus?.focus({ preventScroll: true });
        }

        function handleBackdropClick(e) {
            if (e.target.id === 'quizModalBackdrop') {
                closeQuizModal();
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quizContentArea');

            if (quizState.questions.length === 0) {
                quizState.questions = generateQuizQuestions();
                quizState.currentIndex = 0;
                quizState.score = 0;
                quizState.userAnswers = [];
            }

            if (quizState.questions.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2.5rem 1rem;">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">⏳</div>
                        <h3 style="font-size: 1.3rem; margin-bottom: 0.5rem;">جاري تجهيز الأسئلة...</h3>
                        <p class="card-text">يرجى التأكد من تحميل أحداث هذا اليوم أولاً.</p>
                    </div>
                `;
                return;
            }

            // في حال انتهاء الاختبار وعرض النتيجة
            if (quizState.currentIndex >= quizState.questions.length) {
                renderQuizResults(container);
                return;
            }

            const currentQ = quizState.questions[quizState.currentIndex];
            const currentNum = quizState.currentIndex + 1;
            const totalNum = quizState.questions.length;
            const progressPercent = ((currentNum - 1) / totalNum) * 100;
            const arabicLetters = ['أ', 'ب', 'ج', 'د'];

            container.innerHTML = `
                <div class="quiz-header">
                    <span class="quiz-title-badge">🧠 أختبر معلوماتك التاريخية</span>
                    <span class="quiz-counter">السؤال ${currentNum} من ${totalNum}</span>
                </div>
                
                <div class="quiz-progress-bar">
                    <div class="quiz-progress-fill" style="width: ${progressPercent}%;"></div>
                </div>

                <div class="quiz-question-box">
                    <span class="quiz-meta-tag">🏷️ ${currentQ.category} • تاريخ ${state.day} ${MONTHS_AR[state.month]}</span>
                    <h2 class="quiz-question-text">${currentQ.question}</h2>
                </div>

                <div class="quiz-options-grid" id="quizOptionsGrid">
                    ${currentQ.options.map((opt, i) => `
                        <button class="quiz-option-btn" data-option="${encodeURIComponent(opt)}" onclick="handleQuizAnswer(this)">
                            <span>${opt}</span>
                            <span class="quiz-option-letter">${arabicLetters[i] || (i + 1)}</span>
                        </button>
                    `).join('')}
                </div>

                <div class="quiz-feedback-box" id="quizFeedback"></div>

                <div class="quiz-footer" id="quizFooter" style="display: none;">
                    <button class="quiz-next-btn" onclick="nextQuizQuestion()">
                        <span>${currentNum === totalNum ? '🏁 عرض النتيجة النهائية' : 'السؤال التالي ←'}</span>
                    </button>
                </div>
            `;
        }

        function handleQuizAnswer(selectedBtn) {
            const currentQ = quizState.questions[quizState.currentIndex];
            const selectedOpt = decodeURIComponent(selectedBtn.dataset.option);
            const isCorrect = selectedOpt === currentQ.correctAnswer;

            // تعطيل جميع الخيارات بعد الإجابة
            const allBtns = document.querySelectorAll('.quiz-option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const optVal = decodeURIComponent(btn.dataset.option);
                if (optVal === currentQ.correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            if (!isCorrect) {
                selectedBtn.classList.add('incorrect');
            } else {
                quizState.score++;
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 35, spread: 60, origin: { y: 0.8 } });
                }
            }

            const feedbackEl = document.getElementById('quizFeedback');
            feedbackEl.className = `quiz-feedback-box show ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.innerHTML = `
                <strong>${isCorrect ? '🎉 إجابة صحيحة وممتازة!' : '❌ إجابة غير صحيحة!'}</strong><br>
                <span>${currentQ.explanation}</span>
            `;

            document.getElementById('quizFooter').style.display = 'flex';
        }

        function nextQuizQuestion() {
            quizState.currentIndex++;
            renderQuiz();
            const modalWindow = document.getElementById('quizModalWindow');
            if (modalWindow) modalWindow.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuizResults(container) {
            const total = quizState.questions.length;
            const score = quizState.score;
            const pct = Math.round((score / total) * 100);

            let emoji = '🏆';
            let title = 'مذهل! معلومات تاريخية استثنائية';
            let desc = `لقد أجبت بنجاح على ${score} من أصل ${total} أسئلة (${pct}%) عن أحداث هذا اليوم التاريخي!`;

            if (pct < 50) {
                emoji = '📚';
                title = 'محاولة جيدة!';
                desc = `حصلت على ${score} من ${total}. استمر في قراءة أحداث هذا اليوم وستحقق نتيجة أفضل في المرة القادمة!`;
            } else if (pct < 80) {
                emoji = '🎖️';
                title = 'أداء رائع ومميز!';
                desc = `حققت ${score} من ${total} إجابات صحيحة (${pct}%). لديك ثقافة تاريخية واسعة!`;
            }

            if (score >= 7 && typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 100, origin: { y: 0.6 } });
            }

            container.innerHTML = `
                <div class="quiz-result-card">
                    <div class="quiz-result-badge">${emoji}</div>
                    <h2 class="quiz-result-title">${title}</h2>
                    <div class="quiz-result-score">${score} / ${total}</div>
                    <p class="quiz-result-desc">${desc}</p>
                    <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
                        <button class="quiz-retry-btn" onclick="restartQuiz()">
                            🔄 إعادة اختبار اليوم
                        </button>
                        <button class="quiz-retry-btn" style="background-color: var(--text-secondary);" onclick="closeQuizModal()">
                            ✕ إغلاق والعودة للأحداث
                        </button>
                    </div>
                </div>
            `;
        }

        function restartQuiz() {
            quizState.questions = generateQuizQuestions();
            quizState.currentIndex = 0;
            quizState.score = 0;
            quizState.userAnswers = [];
            renderQuiz();
        }

        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            let items = [];
            const cats = state.category === 'all' ? ['events', 'births', 'deaths', 'holidays'] : [state.category];
            cats.forEach(cat => { (state.rawData[cat] || []).forEach(item => { items.push({ ...item, _cat: cat }); }); });

            if (state.searchQuery.trim()) {
                const q = state.searchQuery.trim().toLowerCase();
                items = items.filter(it => String(it.year).includes(q) || (it.text && it.text.toLowerCase().includes(q)));
            }

            items.sort((a, b) => {
                const yA = typeof a.year === 'number' ? a.year : 9999;
                const yB = typeof b.year === 'number' ? b.year : 9999;
                return state.sortAsc ? yA - yB : yB - yA;
            });

            if (items.length === 0) {
                container.innerHTML = `<div class="timeline-card"><p class="card-text">لا توجد نتائج مطابقة.</p></div>`; return;
            }

            function isBlockedFlag(page) {
                if (!page || !page.thumbnail || !page.thumbnail.source) return false;
                const src = decodeURIComponent(page.thumbnail.source).toLowerCase();
                const title = (page.title || '').toLowerCase();

                // فحص دقيق لمنع علم إسرائيل أو علم إيران
                const israelFlags = ['flag_of_israel', 'علم_إسرائيل', 'علم_اسرائيل'];
                const iranFlags = ['flag_of_iran', 'علم_إيران', 'علم_ايران', 'flag_of_persia', 'flag_of_the_islamic_republic_of_iran'];

                const isIsrael = israelFlags.some(f => src.includes(f) || title.includes(f));
                const isIran = iranFlags.some(f => src.includes(f) || title.includes(f));

                return isIsrael || isIran;
            }

            items.forEach((item, index) => {
                const pageWithThumb = (item.pages || []).find(p => p.thumbnail && p.thumbnail.source && !isBlockedFlag(p));
                const thumbUrl = pageWithThumb ? pageWithThumb.thumbnail.source : null;
                const linksHtml = (item.pages || []).slice(0, 3).map(p => {
                    const href = p.content_urls?.desktop?.page || `https://ar.wikipedia.org/wiki/${encodeURIComponent(p.title)}`;
                    return `<a href="${href}" target="_blank" rel="noopener" class="info-chip">🔗 ${p.titles?.normalized || p.title}</a>`;
                }).join('');

                const catIcons = { events: '📜', births: '👤', deaths: '🕊️', holidays: '🎉' };
                const icon = catIcons[item._cat] || '📖';
                // جلب رابط صورة عالي الجودة إن وجد للتكبير مع fallback للـ thumbnail
                const origUrl = (pageWithThumb && pageWithThumb.originalimage && pageWithThumb.originalimage.source)
                    ? pageWithThumb.originalimage.source
                    : thumbUrl;
                const safeTitle = (pageWithThumb && (pageWithThumb.titles?.normalized || pageWithThumb.title)) || (item.year ? `حدث عام ${item.year} م` : 'أرشيف الحدث');

                const imageHtml = thumbUrl
                    ? `<img src="${thumbUrl}" alt="${safeTitle}" title="انقر لتكبير الصورة 🔍" class="card-thumb" crossorigin="anonymous" loading="lazy" onclick="openLightbox('${origUrl}', '${safeTitle.replace(/'/g, "\\'")}', '${(item.year ? item.year + ' م' : '')}')" onerror="this.outerHTML='<div class=\\'card-thumb-placeholder\\'><span class=\\'placeholder-icon\\'>${icon}</span><span class=\\'placeholder-label\\'>أرشيف تاريخي</span></div>'">`
                    : `<div class="card-thumb-placeholder"><span class="placeholder-icon">${icon}</span><span class="placeholder-label">أرشيف تاريخي</span></div>`;

                const yearDisplay = (typeof item.year === 'number' || (!isNaN(item.year) && item.year !== '—'))
                    ? `<span>${item.year}</span><span class="era-m">م</span>`
                    : `<span>${item.year ?? '—'}</span>`;

                const el = document.createElement('div');
                el.className = 'timeline-item';

                el.innerHTML = `
                    <div class="timeline-dot"></div>
                    <article class="timeline-card" id="card-${index}">
                        <div class="card-content">
                            <div class="card-header">
                                <span class="year-pill">${yearDisplay}</span>
                                <span class="date-badge-mini">
                                    <span class="mini-icon">📅</span>
                                    <span>${state.day} ${MONTHS_AR[state.month]}</span>
                                </span>
                                <span class="category-tag">${CAT_LABELS[item._cat]}</span>
                            </div>
                            <p class="card-text">${item.text}</p>
                            
                            ${linksHtml ? `<div class="card-actions">${linksHtml}</div>` : ''}
                        </div>
                        ${imageHtml}
                    </article>
                `;
                container.appendChild(el);
            });
        }

        document.getElementById('fetchDateBtn').addEventListener('click', () => {
            state.day = parseInt(daySelect.value, 10); state.month = parseInt(document.getElementById('monthSelect').value, 10);
            loadOnThisDay(state.month, state.day);
        });
        document.getElementById('sortBtn').addEventListener('click', (e) => {
            state.sortAsc = !state.sortAsc; e.currentTarget.textContent = state.sortAsc ? '⇅ الأقدم أولاً' : '⇅ الأحدث أولاً'; renderTimeline();
        });
        document.getElementById('searchInput').addEventListener('input', (e) => { state.searchQuery = e.target.value; renderTimeline(); });
        document.getElementById('tabsBar').addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn'); if (!btn) return;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); state.category = btn.dataset.cat; renderTimeline();
        });
        // --- 6. دوال تكبير الصورة (Image Lightbox Functions) ---
        function openLightbox(imgUrl, title, year) {
            const lightbox = document.getElementById('imageLightbox');
            const img = document.getElementById('lightboxImg');
            const caption = document.getElementById('lightboxCaption');

            img.src = imgUrl;
            img.alt = title;
            caption.innerHTML = `<strong>${title}</strong> ${year ? `• <span>${year}</span>` : ''}`;

            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(e) {
            if (e && e.target && e.target.classList.contains('image-lightbox-wrapper')) return;
            const lightbox = document.getElementById('imageLightbox');
            lightbox.classList.remove('active');
            // استعادة التمرير إذا لم تكن نافذة الاختبار مفتوحة
            const quizModal = document.getElementById('quizModalBackdrop');
            if (!quizModal || !quizModal.classList.contains('active')) {
                document.body.style.overflow = '';
            }
        }

        document.getElementById('openQuizBtn').addEventListener('click', openQuizModal);
        document.getElementById('floatingQuizBtn').addEventListener('click', openQuizModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeQuizModal();
                closeLightbox();
            }
        });


        loadOnThisDay(10, 16);
    </script>
</body>

</html>
